name: flutter_widgetz
description: A set of Flutter widgets I use in various projects. Including date and checkbox inputs, bottom navigation bar, color picker, divider and more!
version: 17.0.0
repository: https://github.com/mj12358/flutter-widgetz
screenshots:
  - description: Flutter Widgetz Thumbnail
    path: assets/thumbnail.png
funding:
  - https://www.buymeacoffee.com/mj12358
topics:
  - flutter
  - widget

environment:
  sdk: ">=3.13.2 <4.0.0"
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.2.0

dev_dependencies:
  dart_lintz: 2.2.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/emojis/
    - assets/emojis/filled/
    - assets/emojis/outlined/
    - assets/icons/
    - assets/images/
